server {
    listen 80 default_server;

    # Pagina estatica de teste (sinal de que o nginx em si esta vivo)
    location = / {
        root /var/www/html;
        index index.html;
    }

    # Aplicacao Python: consulta o banco no host1
    location /produtos {
        proxy_pass http://127.0.0.1:8000;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }
}
